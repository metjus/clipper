[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "clipper"
version = "0.1.0"
description = "AI clipper: turn Twitch clips into a vertical TikTok compilation with captions, zooms, SFX and hooks."
requires-python = ">=3.10"
dependencies = [
    "anthropic>=0.80",
    "pydantic>=2.6",
    "fastapi>=0.110",
    "uvicorn>=0.27",
    "python-multipart>=0.0.9",
    "yt-dlp>=2025.1.1",
    "faster-whisper>=1.1",
    "numpy>=1.26",
    "opencv-python-headless>=4.9",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
clipper = "clipper.cli:main"

[tool.setuptools.packages.find]
include = ["clipper*"]

[tool.setuptools.package-data]
clipper = ["assets/fonts/*", "assets/models/*", "web/static/*"]
